<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080312" />
    <meta
      name="description"
      content="NEON DASH - an original rhythm platformer. Run, jump and fly through neon geometry in time with the music."
    />
    <title>NEON DASH</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080312'/%3E%3Cpath d='M9 23V9l14 14V9' stroke='%232ff3f0' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="game-root" aria-label="NEON DASH game canvas"></div>

    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-splash__mark">NEON<span>DASH</span></div>
      <div class="boot-splash__bar"><i></i></div>
      <p class="boot-splash__hint">Loading&hellip;</p>
    </div>

    <noscript>
      <div class="fatal">
        <h1>JavaScript required</h1>
        <p>NEON DASH runs in the browser and needs JavaScript enabled to start.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
